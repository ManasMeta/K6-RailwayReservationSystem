# Runs on every pull request to main, develop or a group branch, and on pushes to main/develop.
# A red check blocks the merge.
name: CI

on:
  pull_request:
    branches: [main, develop, 'group/**']
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: database (migrations, import, SQL tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nrrms_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nrrms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migration numbering and ranges
        run: python db/migrate.py check
      - name: Apply every migration
        run: python db/migrate.py up
      - name: Import the sample timetable and generate coaches
        run: |
          python db/import/load_sample.py
          python db/import/generate_inventory.py
      - name: SQL assertion scripts
        run: |
          for f in db/tests/*.sql; do
            echo "::group::$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: Migrations again must be a no-op
        run: |
          out=$(python db/migrate.py up)
          echo "$out"
          if echo "$out" | grep -q "^Applying migration"; then echo "a rerun applied migrations"; exit 1; fi
      - name: Demo seeds load on a migrated database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seeds/g1_demo_users.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seeds/g6_demo_data.sql

  backend:
    name: backend (ruff, pytest against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nrrms_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nrrms_test
      JWT_SECRET: ci-only-secret-with-more-than-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: |
          python db/migrate.py up
          python db/import/load_sample.py
          python db/import/generate_inventory.py
      - run: pytest backend/tests -q

  backend-as-app-role:
    name: backend API as the restricted app role (row-level security on)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nrrms_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nrrms_test
      JWT_SECRET: ci-only-secret-with-more-than-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrate and make the restricted login
        run: |
          export DATABASE_URL="$ADMIN_DATABASE_URL"
          python db/migrate.py up
          python db/import/load_sample.py
          python db/import/generate_inventory.py
          APP_DB_USER=nrrms_api APP_DB_PASSWORD=ci-app-password python db/create_login_role.py
      - name: "Smoke test - sign up, book, pay and cancel as nrrms_app"
        env:
          DATABASE_URL: postgresql://nrrms_api:ci-app-password@localhost:5432/nrrms_test
        run: |
          cd backend
          uvicorn app.main:app --port 8000 &
          sleep 5
          python ../scripts/smoke_test.py http://127.0.0.1:8000

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t nrrms-backend .
      - run: docker build -t nrrms-frontend frontend
