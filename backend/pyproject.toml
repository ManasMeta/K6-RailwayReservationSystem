[project]
name = "nrrms-backend"
version = "1.0.0"
description = "National Railway Reservation and Management System - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.2,<6.0",
    "reportlab>=4.2,<5.0",
    "qrcode[pil]>=8.0,<9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
