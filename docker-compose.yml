services:
  db:
    image: postgres:16
    container_name: nrrms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nrrms
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - nrrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nrrms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nrrms_pgdata:
